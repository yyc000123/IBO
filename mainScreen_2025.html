<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>PDF 作答系統</title>

<style>
body {
    margin: 0;
}

.container {
    display: flex;
    height: 100vh;
}

.left {
    width: 60%;
    border-right: 1px solid #ccc;
}

.right {
    width: 40%;
    padding: 20px;
    box-sizing: border-box;
    height: 100vh;
    overflow-y: auto;
}

.result {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

    <!-- 左側 PDF（固定不動） -->
    <div class="left">
		                                                                                                 <!-- choose the pdf you want -->
        <embed src="https://tpmso.org/ibo/wp-content/uploads/2025/09/2025_1st_exam-.pdf"
               type="application/pdf"
               width="100%"
               height="100%">
    </div>

    <!-- 右側作答區（可捲動） -->
    <div class="right">
        <h2>作答區</h2>

        <div id="multi-questions"></div>

	<p></p>

        <button onclick="checkAnswer()">提交</button>
        <div class="result" id="result"></div>
    </div>
</div>

<script>
/* ===============================
   載入答案 JSON
================================ */
const answers = {
  multi: {                                                                              /*put the answer here*/
    1: { must: ["B", "C", "D"], mustNot: ["A", "E"] },
    2: { must: ["B", "C", "E"], mustNot: ["A", "D"] },
    3: { must: ["B", "C", "D", "E"], mustNot: ["A"] },
    4: { must: ["A", "E"], mustNot: ["B", "C", "D"] },
    5: { must: ["A", "C", "E"], mustNot: ["B", "D"] },
    6: { must: ["C"], mustNot: ["A", "B", "D", "E"] },
    7: { must: ["B"], mustNot: ["A", "C", "D"] },
    8: { must: ["B"], mustNot: ["A", "C", "D", "E"] },
    9: { must: ["A", "B", "E"], mustNot: ["C", "D"] },
    10: { must: ["D"], mustNot: ["A", "B", "C", "E"] },
    11: { must: ["B", "C", "D"], mustNot: ["A", "E"] },
    12: { must: ["A", "C", "D", "E"], mustNot: ["B"] },
    13: { must: ["A", "E"], mustNot: ["B", "C", "D"] },
    14: { must: ["B", "C", "D"], mustNot: ["A", "E"] },
    15: { must: ["A", "D", "E"], mustNot: ["B", "C"] },
    16: { must: ["B", "D", "E"], mustNot: ["A", "C"] },
    17: { must: ["C"], mustNot: ["A", "B", "D", "E"] },
    18: { must: ["A", "E"], mustNot: ["B", "C", "D"] },
    19: { must: ["B", "E"], mustNot: ["A", "C", "D"] },
    20: { must: ["A", "D"], mustNot: ["B", "C", "E"] },
    21: { must: ["A", "C", "D"], mustNot: ["B", "E"] },
    22: { must: ["B", "C", "E"], mustNot: ["A", "D"] },
    23: { must: ["A", "B", "C", "D", "E"], mustNot: [] },
    24: { must: ["B", "C", "D", "E"], mustNot: ["A"] },
    25: { must: ["C"], mustNot: ["A", "B", "D", "E"] },
    26: { must: ["C", "D"], mustNot: ["A", "B", "E"] },
    27: { must: ["C", "E"], mustNot: ["A", "B", "D"] },
    28: { must: ["D"], mustNot: ["A", "B", "C", "E"] },
    29: { must: ["A", "D", "E"], mustNot: ["B", "C"] },
    30: { must: ["B", "E"], mustNot: ["A", "C", "D"] },
    31: { must: ["B", "C", "E"], mustNot: ["A", "D"] },
    32: { must: ["C", "E"], mustNot: ["A", "B", "D"] },
    33: { must: ["D", "E"], mustNot: ["A", "B", "C"] },
    34: { must: ["B", "C"], mustNot: ["A", "D", "E"] },
    35: { must: ["B", "C"], mustNot: ["A", "D", "E"] },
    36: { must: ["B", "D", "E"], mustNot: ["A", "C"] },
    37: { must: ["A", "D"], mustNot: ["B", "C", "E"] },
    38: { must: ["A", "C", "E"], mustNot: ["B", "D"] },
    39: { must: ["B"], mustNot: ["A", "C", "D", "E"] },
    40: { must: ["B"], mustNot: ["A", "C", "D", "E"] },
    41: { must: ["A", "B", "C", "D", "E"], mustNot: [] },
    42: { must: ["A", "B", "D"], mustNot: ["C", "E"] },
    43: { must: ["A", "D"], mustNot: ["B", "E"] },
    44: { must: ["C", "E"], mustNot: ["A", "B", "D"] },
    45: { must: ["A", "E"], mustNot: ["B", "C"] },
    46: { must: ["A", "B", "E"], mustNot: ["C", "D"] },
    47: { must: ["B", "D", "E"], mustNot: ["A", "C"] },
    48: { must: ["A", "C", "D"], mustNot: ["B", "E"] },
    49: { must: ["B", "C", "D"], mustNot: ["A", "E"] },
    50: { must: ["A", "B", "C", "E"], mustNot: ["D"] },
    51: { must: ["A", "B", "D"], mustNot: ["C", "E"] },
    52: { must: ["C", "D"], mustNot: ["A", "B", "E"] },
    53: { must: ["B", "C"], mustNot: ["A", "D", "E"] },
    54: { must: ["A", "C", "D"], mustNot: ["B", "E"] },
    55: { must: ["A", "D", "E"], mustNot: ["B", "C"] },
    56: { must: ["A", "C", "D"], mustNot: ["B", "E"] },
    57: { must: ["A", "E"], mustNot: ["B", "C", "D"] },
    58: { must: ["A", "C", "E"], mustNot: ["B", "D"] },
    59: { must: ["A", "B", "D", "E"], mustNot: ["C"] },
    60: { must: ["B", "D", "E"], mustNot: ["A", "C"] }
  }
};

/* ===============================
   動態產生 60 題
================================ */
const container = document.getElementById("multi-questions");
let options = [];
const TOTAL = 60;                                                              /*the numbers of the questions*/
const total = 5 ;                                                              /*the numbers of the options*/

for ( let i = 0 ; i < total ; i++ ) {
    options.push(String.fromCharCode('A'.charCodeAt(0) + i)) ;
}

for (let q = 1; q <= TOTAL; q++) {
    const title = document.createElement("p");
    title.textContent = `第 ${q} 題`;
    container.appendChild(title);

    options.forEach(opt => {
        const label = document.createElement("label");
        label.innerHTML = `
            <input type="checkbox" name="q_${q}" value="${opt}">
            (${opt})
        `;
        container.appendChild(label);
        container.appendChild(document.createElement("br"));
    });
}

/* ===============================
   判斷是否正確
================================ */
function isCorrect(selected, rule) {
    if(selected.length==0) return 0 ;
    let cnt = 0 ;
    for (const opt of rule.must || []) {
        if (!selected.includes(opt)) cnt++;
    }
    for (const opt of rule.mustNot || []) {
        if (selected.includes(opt)) cnt++;
    }
    return total-cnt;
}

/* ===============================
   提交與批改
================================ */
function checkAnswer() {
    let score = 0;

    for (let q = 1; q <= TOTAL; q++) {
        const rule = answers.multi[q];

        if (!rule) continue;

        const selected = Array.from(
            document.querySelectorAll(`input[name="q_${q}"]:checked`)
        ).map(cb => cb.value);

	const temp = isCorrect(selected, rule) ;

	if(temp==5) score+=2 ;                                                             /*the score cnt rule*/
	else if(temp==4) score+=1.2 ;
	else if(temp==3) score+=0.4 ;

	let optional = "" ;

	for(let i=0 ; i<total ; i++){
 	    let ch = String.fromCharCode('A'.charCodeAt(0) + i) ;
	    if(!rule.must.includes(ch) && !rule.mustNot.includes(ch)) optional+=ch ;
	}

	if(temp==5) document.getElementById("result").innerHTML += `第${q}題：正確✅<br>` ;
	else document.getElementById("result").innerHTML += `第${q}題：錯誤❌<br>`;

	document.getElementById("result").innerHTML += `正確答案：${rule.must.join("")}` ;

	if(optional.length!=0) document.getElementById("result").innerHTML += `(${optional})` ;

	document.getElementById("result").innerHTML += `<br><br>` ;

    }

    document.getElementById("result").innerHTML +=
	`👍👍👍分數：${score} / ${120}👍👍👍<br><br>` ;

    document.getElementById("result").innerHTML += `
    <a href="https://tpmso.org/ibo/index.php/first-round-selection/" target="_blank">詳解</a><br>`;                         /*the url of the detailed explanation*/

    // 鎖定所有選項
    document
        .querySelectorAll('input[type="checkbox"]')
        .forEach(i => i.disabled = true);

    // 鎖定按鈕
    document.querySelector("button").disabled = true;
}
</script>
</body>
</html>
