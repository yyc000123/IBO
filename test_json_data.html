<body>
  <h2>JSON 內容</h2>
  <div id="output">載入中...</div>

  <script>
    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        const out = document.getElementById("output");
        out.innerHTML = "";

        console.log("fetch success");

        const multi = data.multi;

        for (const qid in multi) {
          const q = multi[qid];

          const must = q.must.join(" ");
          const optional = q.optional.length
            ? `（${q.optional.join(" ")}）`
            : "";

          out.innerHTML += `
            <div class="section">
              <b>題號 ${qid}</b><br>
              ${must} ${optional}
            </div>
          `;
        }
      })
      .catch(err => {
        const out = document.getElementById("output");
        if (out) out.textContent = "讀取失敗";
        console.error(err);
      });
  </script>
</body>
