<script>
fetch("data.json")
  .then(res => res.json())
  .then(data => {
    const out = document.getElementById("output");
    out.innerHTML = "";

    const multi = data.multi;

    for (const qid in multi) {
      const q = multi[qid];

      out.innerHTML += `
        <div class="section">
          <b>題號 ${qid}</b><br>
          ${q.must.join(", ")}(${q.optional.length ? q.optional.join(", "))
        </div>
      `;
    }
  })
  .catch(err => {
    document.getElementById("output").textContent = "讀取失敗";
    console.error(err);
  });
</script>
