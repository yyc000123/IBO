const menu = document.getElementById("menu");

const years = ["1999A", "1999B", "2000A", "2000B"];
for (let y = 2001; y <= 2025; y++) {                                                                               /*the last year*/
    years.push(String(y));
}

const total_questions = [80, 40, 80, 40, 80] ;                                                                     /*the numbers of the questions*/

const total_options = [4, 4, 5, 5, 5] ;                                                                            /*the numbers of the options*/

let pos = 0 ;



years.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item;
    btn.onclick = () => {
	for(let i=0 ; i<years.length ; i++){
	    if(years[i]==item){
		pos = i ;
		showExam() ;
		break ;
	    }
	}
    };
    menu.appendChild(btn);
});

    /*clear*/
    document.getElementById("title").style.display = "none";

    .right {

        padding: 20px;
        box-sizing: border-box;

    embed {
        display: block;

        height: 100%;
    }
    </style>

    <div class="container">
        <div class="left">
            <embed src="https://cses.fi/book/book.pdf"                                                          /*${urls[pos]}*/
                type="application/pdf"
                width="100%"
                height="100%">
        </div>

        <div class="right">
            <h2>作答區</h2>

	    <div id="showQuestions"></div>

	    <p></p>

            <button onclick="checkAnswer(this)">提交</button>
            <div class="result" id="result"></div>

        </div>
    </div>
    `;



    /*showQuestions*/
    let options = [] ;

    for(let i=0 ; i<5 ; i++){                                                                                        /*total_options[pos]*/
        options.push(String.fromCharCode('A'.charCodeAt(0) + i)) ;
    }

    const showQuestions_container = document.getElementById("showQuestions") ;

    for(let i=1 ; i<=2 ; i++){                                                                                       /*total_question[pos]*/
        const title = document.createElement("p");
        title.textContent = `第 ${i} 題`;
        showQuestions_container.appendChild(title);

        options.forEach(opt => {
            const label = document.createElement("label");
            label.innerHTML = `
                <input type="checkbox" name="q_${i}" value="${opt}">
                (${opt})
            `;
            showQuestions_container.appendChild(label);
            showQuestions_container.appendChild(document.createElement("br"));
        });
    }
}
