<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title></title>



<style>

#title {
    font-family: Arial, sans-serif;
    padding: 20px;
}

#menu {
    font-family: Arial, sans-serif;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 10px;
}

button {
    padding: 10px 0;
    font-size: 16px;
    cursor: pointer;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#viewer {
	display: none;
    width: 100vw;
    height: 100vh;
    button {
		padding: 0px 0;
		font-size: 16px;
		cursor: pointer;
    }
}

</style>
</head>



<body>

<div id="title"></div>

<div id="menu"></div>

<div id="viewer"></div>



<script>



document.getElementById("title").innerHTML = `<h1>生物奧林匹亞初賽試題</h1>` ;

const menu = document.getElementById("menu");
/*
const years = ["1999A", "1999B", "2000A", "2000B"];
for (let y = 2001; y <= 2025; y++) {                                                                                        // the last year
    years.push(String(y));
}
*/
const years = ["1999A", "2025"] ;
	
const total_questions = [80, 60] ;                                                                                          // the numbers of the questions

const total_options = [4, 5] ;                                                                                              // the numbers of the options

const multi_or_not = [0, 1] ;                                                                                               // 單選題0多選題1

const urls = [                                                                                                              // the url of pdf
	"https://tpmso.org/ibo/wp-content/uploads/2022/07/1999_1st_exam_A.pdf",
	"https://tpmso.org/ibo/wp-content/uploads/2025/09/2025_1st_exam-.pdf"
] ;

const total_points = [80, 120] ;                                                                                            // the total scores of the exam

const url_of_detailed_explanation = [                                                                                       // the url of the detailed explanation
	"https://tpmso.org/ibo/index.php/first-round-selection/",
	"https://tpmso.org/ibo/index.php/first-round-selection/"
] ;

let pos = 0 ;



years.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item;
    btn.onclick = () => {
	for(let i=0 ; i<years.length ; i++){
	    if(years[i]==item){
		pos = i ;
		showExam() ;
		break ;
	    }
	}
    };
    menu.appendChild(btn);
});



function showExam() {
    /*clear*/
    document.getElementById("title").style.display = "none";
    document.getElementById("menu").style.display = "none";
	document.getElementById("viewer").style.display = "block";

    /*set the answering page*/
    document.getElementById("viewer").innerHTML = `
    <style>
    .container {
        display: flex;
        height: 100vh;
    }
    .left {
        width: 60%;
        border-right: 1px solid #ccc;
    }
    .right {
        width: 40%;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
    }
    embed {
        display: block;
        width: 100%;
        height: 100%;
    }
    </style>

    <div class="container">
        <div class="left">
            <embed src="${urls[pos]}"
                type="application/pdf"
                width="100%"
                height="100%">
        </div>

        <div class="right">
            <h2>作答區</h2>
	    	<div id="showQuestions"></div>
	    	<p></p>
            <button onclick="checkAnswer(this)">提交</button>
			<p></p>
            <div class="result" id="result"></div>
        </div>
    </div>
    `;



    /*showQuestions*/
    let options = [] ;

    for(let i=0 ; i<total_options[pos] ; i++){
        options.push(String.fromCharCode('A'.charCodeAt(0) + i)) ;
    }

    const showQuestions_container = document.getElementById("showQuestions") ;

    for(let i=1 ; i<=total_questions[pos] ; i++){
        const title = document.createElement("p");
        title.textContent = `第 ${i} 題`;
        showQuestions_container.appendChild(title);

		if(multi_or_not[pos]){
			options.forEach(opt => {
	            const label = document.createElement("label");
	            label.innerHTML = `
	                <input type="checkbox" name="q_${i}" value="${opt}">
	                (${opt})
	            `;
	            showQuestions_container.appendChild(label);
	            showQuestions_container.appendChild(document.createElement("br"));
	        });
		}
		else{
			options.forEach(opt => {
	            const label = document.createElement("label");
	            label.innerHTML = `
	                <input type="radio" name="q_${i}" value="${opt}">
	                (${opt})
	            `;
	            showQuestions_container.appendChild(label);
	            showQuestions_container.appendChild(document.createElement("br"));
	        });
		}
    }
}


/*check the answer*/
async function checkAnswer(btn) {

    let score = 0;

	try {
		const res = await fetch("${years[pos]}-answer.json");
    	const data = await res.json();

		for(let q=1 ; q<=total_questions[pos] ; q++){
			const rule = data.multi[q] ;

			if(!rule){
				console.log("question ${q} rule can not be find") ;
				continue ;
			}
				
			const selected = Array.from(
				document.querySelectorAll(`input[name="q_${q}"]:checked`)
			).map(cb => cb.value);

			const temp = countScore(selected, rule, q) ;

			score += temp.score ;

			if(temp.flag) document.getElementById("result").innerHTML += `第${q}題：正確✅<br>` ;
			else document.getElementById("result").innerHTML += `第${q}題：錯誤❌<br>`;
			document.getElementById("result").innerHTML += `正確答案：${rule.must.join("")}` ;
			if(rule.optional.length!=0) document.getElementById("result").innerHTML += `(${rule.optional})` ;
			document.getElementById("result").innerHTML += `<br><br>` ;
	
		}
	} catch (err) {
		console.error("Error when checking answer: ", err) ;
	}

    document.getElementById("result").innerHTML += `👍👍👍分數：${score} / ${total_points[pos]}👍👍👍<br><br>` ;

    document.getElementById("result").innerHTML += `
    <a href="${url_of_detailed_explanation[pos]}" target="_blank">詳解</a><br>`;

    // 鎖定所有選項
    document
        .querySelectorAll('input[type="checkbox"]')
        .forEach(i => i.disabled = true);

    // 鎖定按鈕
	btn.disabled = true;
}



function countScore(selected, rule, question_number){
	
	if(selected.length==0){
		return {
			score: 0,
			flag: false
		}
	}
	
	let score = 0 ;
    let flag = true ;
    let cnt = 0 ;
	
    for (const opt of rule.must || []) {
        if (!selected.includes(opt)) cnt++;
    }
    for (const opt of rule.mustNot || []) {
        if (selected.includes(opt)) cnt++;
    }

	if(cnt) flag=false ;

	cnt = total_options[pos] - cnt ;
	
																												          	// the rule of counting score

	if(multi_or_not[pos]){
		if(cnt==total_options[pos]) score = 2 ;
		else if(cnt==total_options[pos]-1) score = 1.2 ;
		else if(cnt==total_options[pos]-2) score = 0.4 ;
	}
	else{
		if(pos==0){
			if(cnt==total_options[pos]) score = 1 ;
		}
		else if(pos==2){
			if(cnt==total_options[pos]){
				if(question_number<=60) score = 1 ;
				else score = 2 ;
			}
		}
	}

    return {
        score: score,
    	flag: flag
    };
}



</script>



</body>
</html>
